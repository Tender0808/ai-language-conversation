<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一轮对话练习</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <header class="practice-header">
            <p class="round-label">ROUND 1 / 第一轮</p>
            <h1>レストラン電話予約練習</h1>
            <p>AI 店员会按照日本餐厅的电话接待流程与你对话。</p>
        </header>
        <section class="chat-panel" aria-label="第一轮对话">
            <div class="message employee-message">
                <p class="speaker">店員 / 店员</p>
                <p>お電話ありがとうございます。焼肉さくらでございます。</p>
            </div>
        </section>
        <form class="message-form">
            <label for="user-message">你的回答</label>
            <textarea id="user-message" name="userMessage" rows="4" placeholder="请用日语输入你的回答" required></textarea>

            <button type="submit">送信する / 发送</button>
        </form>

    </main>
    <script src="script.js"></script>
</body>

</html>
