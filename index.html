<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐厅电话预约练习</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <header>
            <p>AI Japanese Conversation</p>
            <h1>任務1：レストラン電話予約練習</h1>
            <h2>任务一：餐厅电话预约练习</h2>
        </header>
        <section>
            <h3>练习目标</h3>
            <p>请通过电话与餐厅店员对话，并完成预约。</p>
        </section>
        <section>
            <h3>预约条件</h3>
            <ul>
                <li>日期：2026年10月10日</li>
                <li>时间：晚上7点</li>
                <li>人数：2人</li>
                <li>座位：禁烟区</li>
                <li>预约姓名：请自由设定（可以使用练习用姓名）</li>
            </ul>
        </section>
        <section>
            <h3>第一轮规则</h3>
            <p>
                请根据自己目前的日语能力完成对话。
                第一轮练习中不会显示参考答案。
                对话结束后，AI 会提供表达和电话礼仪方面的反馈。
            </p>
        </section>
        <button type="button">
            第一轮练习を始める / 开始第一轮练习
        </button>
    </main>
</body>

</html>
